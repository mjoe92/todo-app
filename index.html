<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <div class="app-title">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-label="Todo App logo">
        <rect x="2" y="2" width="20" height="20" rx="6" fill="currentColor" opacity="0.15"/>
        <rect x="2" y="2" width="20" height="20" rx="6" stroke="currentColor" stroke-width="1.5"/>
        <path d="M7.5 12.5L10.5 15.5L16.5 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="app-title-text">My Tasks</span>
    </div>

    <div class="lang-switcher" role="group" aria-label="Language">
      <button class="lang-arrow" id="lang-prev" type="button" onclick="shiftLang(-1)" aria-label="Previous languages">&#8249;</button>
      <div class="lang-pages" id="lang-pages"></div>
      <button class="lang-arrow" id="lang-next" type="button" onclick="shiftLang(1)" aria-label="Next languages">&#8250;</button>
    </div>

    <button class="btn-add" onclick="openModal()" aria-label="Create new task">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span class="btn-add-text">New task</span>
    </button>

    <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle dark mode">
      <svg id="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
      <svg id="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<main class="app-main">
  <div class="filter-tabs" role="tablist" aria-label="Filter tasks">
    <button class="filter-tab active" role="tab" aria-selected="true"  onclick="setFilter('active', this)">Active</button>
    <button class="filter-tab"        role="tab" aria-selected="false" onclick="setFilter('done',    this)">Done</button>
    <button class="filter-tab"        role="tab" aria-selected="false" onclick="setFilter('ignored', this)">Ignored</button>
    <button class="filter-tab"        role="tab" aria-selected="false" onclick="setFilter('all',     this)">All</button>
  </div>

  <div id="day-filter-bar" class="filter-tabs" role="tablist" aria-label="Filter by day"></div>

  <div id="task-list" role="list" aria-label="Task list"></div>

  <p class="reset-note" id="reset-note"></p>
  <p class="swipe-hint" id="swipe-hint" style="display:none">&#8592; Swipe left to delete &nbsp;&middot;&nbsp; Swipe right to ignore &#8594;</p>
</main>

<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">New Task</span>
      <button class="modal-close" onclick="closeModal()" aria-label="Close modal">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <label class="form-label" for="task-input">Task title</label>
    <textarea class="form-input" id="task-input" rows="3" placeholder="What needs to be done?" maxlength="300"></textarea>
    <div class="day-picker-row">
      <label class="form-label" id="day-picker-label">Visible on days</label>
      <div id="day-picker" class="day-picker"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitTask()" id="modal-submit">Add task</button>
    </div>
  </div>
</div>

<script src="./assets/i18n.js"></script>
<script src="./assets/storage.js"></script>
<script src="./assets/theme.js"></script>
<script src="./assets/tasks.js"></script>
<script src="./assets/swipe.js"></script>
<script src="./assets/render.js"></script>
<script src="./assets/modal.js"></script>
<script src="./assets/app.js"></script>

<script src="./assets/sw-register.js"></script>

</body>
</html>
